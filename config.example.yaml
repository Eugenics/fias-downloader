# Конфигурация fias-downloader.
#
# По умолчанию сервис ищет файл config.yaml в текущей рабочей директории.
# Другой путь можно задать флагом --config или переменной окружения
# FIAS_CONFIG_PATH (это единственная переменная окружения, которую
# использует сервис — весь остальной конфиг читается только отсюда).
#
# Скопируйте этот файл в config.yaml и подставьте свои значения:
#   cp config.example.yaml config.yaml

postgres:
  # Строка подключения к PostgreSQL.
  dsn: "postgres://fias:fias@localhost:5432/fias?sslmode=disable"

source:
  # Адрес перечня версий ФИАС/ГАР.
  url: "https://fias.nalog.ru/WebServices/Public/GetAllDownloadFileInfo"
  # Таймаут запроса перечня версий.
  http_timeout: "30s"

download:
  # Каталог для сохранения (в т.ч. частично) загруженных архивов.
  dir: "./data/downloads"
  # Таймаут неактивности при потоковой загрузке файла: если за это время
  # не пришло ни одного байта, загрузка считается оборванной и будет
  # повторена (с докачкой) согласно max_retries/retry_base_delay.
  stall_timeout: "2m"
  # Количество повторных попыток при временных сетевых ошибках.
  max_retries: 5
  # Базовая задержка экспоненциального backoff между попытками.
  retry_base_delay: "5s"
  # Как часто сохранять прогресс докачки в БД.
  progress_save_interval: "5s"

http:
  # Адрес, на котором поднимается HTTP API (ручное управление + /metrics).
  listen_addr: ":8080"

scheduler:
  # Периодичность автоматической проверки обновлений.
  poll_interval: "6h"
