services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fias
      POSTGRES_PASSWORD: fias
      POSTGRES_DB: fias
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fias -d fias"]
      interval: 5s
      timeout: 5s
      retries: 10

  fias-downloader:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/config.docker.yaml:/app/config.yaml:ro
      - ./var/data/downloads:/app/data/downloads
    ports:
      - "8888:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    depends_on:
      - fias-downloader
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9999:9090"

volumes:
  pgdata:
  prometheus-data:
