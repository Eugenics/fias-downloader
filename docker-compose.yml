services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fias
      POSTGRES_PASSWORD: fias
      POSTGRES_DB: fias
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fias -d fias"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fias-downloader-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: fias
      RABBITMQ_DEFAULT_PASS: fias
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fias-downloader-network

  fias-downloader:
    image: fias-downloader-fias-downloader
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./deploy/config.docker.yaml:/app/config.yaml:ro
      - ./var/data/downloads:/app/data/downloads
    ports:
      - "8888:8080"
    networks:
      - fias-downloader-network

  fias-downloader-prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    depends_on:
      - fias-downloader
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9999:9090"
    networks:
      - fias-downloader-network
  # fias-downloader-grafana:
  #   image: grafana/grafana:11.1.0
  #   restart: unless-stopped
  #   depends_on:
  #     - fias-downloader-prometheus
  #   environment:
  #     GF_SECURITY_ADMIN_USER: admin
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  #     # Отключает анонимный сбор аналитики использования Grafana.
  #     GF_ANALYTICS_REPORTING_ENABLED: "false"
  #   volumes:
  #     - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
  #     - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
  #     - grafana-data:/var/lib/grafana
  #   ports:
  #     - "3001:3000"
  #   networks:
  #     - fias-downloader-network

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  rabbitmq-data:

networks:
  fias-downloader-network:
    name: fias-downloader-network
